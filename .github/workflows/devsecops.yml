name: DevSecOps Pipeline - FleetSec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scanning:
    name: Gitleaks Secrets Scan (Modo Estricto Manual)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks Manual
        run: |
          # Descargamos el binario directamente para forzar el análisis de archivos
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          # --no-git fuerza la lectura de archivos físicos ignorando el historial de commits
          ./gitleaks detect --no-git --source . -v 

  sast-semgrep:
    name: Semgrep SAST (Reglas Oficiales + Custom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        run: |
          pip install semgrep
          # Apuntamos ESPECÍFICAMENTE a la carpeta app/ para no mezclar con IaC
          semgrep scan app/ --config auto --config .semgrep/custom-rules.yml --error

  sca-trivy:
    name: Trivy SCA & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Dependency Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          exit-code: 1
          severity: 'CRITICAL,HIGH' 

      - name: Generar SBOM CycloneDX JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom-cyclonedx.json

  container-security:
    name: Container Security & IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Validar Dockerfile con Hadolint (Bloquea :latest)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile
          failure-threshold: error
          
      - name: Build Docker Image
        run: docker build -t fleetsec-app:local ./app
        
      - name: Scan Image with Trivy (Falla por usuario Root y CVEs de librerías base)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fleetsec-app:local'
          exit-code: 1
          severity: 'CRITICAL'

  iac-checkov:
    name: Checkov IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Infrastructure Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          soft_fail: false 

  dast-zap:
    name: DAST ZAP Automation
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Iniciar aplicación en staging local
        run: |
          docker build -t fleetsec-app:local ./app
          # Usamos --network host para que el contenedor exponga el puerto directamente en la máquina runner
          docker run -d --network host --name app fleetsec-app:local
          sleep 10
          
      - name: Generar Bearer JWT de prueba
        run: |
          cd app
          npm install jsonwebtoken
          TOKEN=$(node -e "const jwt = require('jsonwebtoken'); console.log(jwt.sign({ id: 1, role: 'admin' }, 'super_secret_key', { algorithm: 'HS256' }));")
          echo "ZAP_JWT_TOKEN=$TOKEN" >> $GITHUB_ENV
          
      - name: OWASP ZAP API Scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'app/openapi.yaml' 
          format: openapi
          allow_issue_writing: true
          fail_action: true 
        env:
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ env.ZAP_JWT_TOKEN }}"
          ZAP_AUTH_HEADER: "Authorization"
  security-summary:
    name: DevSecOps Consolidated Report
    runs-on: ubuntu-latest
    needs: [secrets-scanning, sast-semgrep, sca-trivy, container-security, iac-checkov, dast-zap]
    if: always() # Corre sin importar si los jobs anteriores pasaron o fallaron
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./reports

      - name: Generar Reporte Unificado Markdown ($GITHUB_STEP_SUMMARY)
        run: |
          echo "# DevSecOps Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "Este reporte consolida los hallazgos de seguridad detectados en el pipeline." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### Estado de los Quality Gates" >> $GITHUB_STEP_SUMMARY
          echo "| Herramienta | Stage | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Gitleaks** | Secret Scanning | ${{ needs.secrets-scanning.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Semgrep** | SAST (Código) | ${{ needs.sast-semgrep.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trivy FS** | SCA (Dependencias) | ${{ needs.sca-trivy.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Hadolint / Trivy** | Container Security | ${{ needs.container-security.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Checkov** | IaC (Terraform) | ${{ needs.iac-checkov.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **OWASP ZAP** | DAST (Staging) | ${{ needs.dast-zap.result == 'success' && '✅ PASS' || '❌ FAIL' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Resumen de Hallazgos Clave" >> $GITHUB_STEP_SUMMARY
          echo "> **Instrucción para el desarrollador:** Si algún stage tiene estado **FAIL**, revisa la sección 'Security' de GitHub o descarga los artefactos de la ejecución para ver los vectores de ataque exactos y sus remediaciones." >> $GITHUB_STEP_SUMMARY