name: DevSecOps Pipeline - FleetSec

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scanning:
    name: Gitleaks Secrets Scan (Modo Estricto Completo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Run Gitleaks Manual
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.1/gitleaks_8.18.1_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.1_linux_x64.tar.gz
          # "--no-git" fuerza a Gitleaks a escanear los archivos en texto plano sin importar la historia de git
          ./gitleaks detect --no-git --source . -v

  sast-semgrep:
    name: Semgrep SAST (Reglas Oficiales + Custom)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep Scan
        run: |
          pip install semgrep
          # "--config auto" trae el Top 10 de OWASP. "--config .semgrep/custom-rules.yml" trae tus reglas (Ley 1581, SQLi, etc).
          semgrep scan --config auto --config .semgrep/custom-rules.yml --error

  sca-trivy:
    name: Trivy SCA & SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Dependency Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          exit-code: 1
          severity: 'CRITICAL,HIGH' # Bloquea dependencias vulnerables

      - name: Generar SBOM CycloneDX JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          format: 'cyclonedx'
          output: 'sbom-cyclonedx.json'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom-cyclonedx.json

  container-security:
    name: Container Security & IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Validar Dockerfile con Hadolint (Bloquea tags no pinneados)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./app/Dockerfile
          failure-threshold: error
          
      - name: Build Docker Image
        run: docker build -t fleetsec-app:local ./app
        
      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fleetsec-app:local'
          exit-code: 1
          severity: 'CRITICAL'

  iac-checkov:
    name: Checkov IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkov Infrastructure Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/
          soft_fail: false # False asegura que los hallazgos bloqueen el pipeline

  dast-zap:
    name: DAST ZAP Automation
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Iniciar aplicación en staging local
        run: |
          docker build -t fleetsec-app:local ./app
          docker run -d -p 3000:3000 --name app fleetsec-app:local
          # Damos tiempo a que el servidor levante correctamente
          sleep 10
          
      - name: Generar Bearer JWT de prueba
        run: |
          cd app
          npm install jsonwebtoken
          # Generamos un token válido para el escáner firmándolo con la misma clave expuesta
          TOKEN=$(node -e "const jwt = require('jsonwebtoken'); console.log(jwt.sign({ id: 1, role: 'admin' }, 'super_secret_key', { algorithm: 'HS256' }));")
          echo "ZAP_JWT_TOKEN=$TOKEN" >> $GITHUB_ENV
          
      - name: OWASP ZAP API Scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'app/openapi.yaml'
          format: openapi
          allow_issue_writing: true
          fail_action: true # Bloquea el pipeline directamente si ZAP encuentra vulnerabilidades
        env:
          ZAP_AUTH_HEADER_VALUE: "Bearer ${{ env.ZAP_JWT_TOKEN }}"
          ZAP_AUTH_HEADER: "Authorization"