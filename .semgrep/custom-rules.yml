rules:
  - id: pii-logging-ley1581
    patterns:
      - pattern-either:
          - pattern: console.log(...)
          - pattern: console.info(...)
          - pattern: console.error(...)
      - pattern-regex: "(?i)(cédula|cedula|email|correo|cc|telefono|direccion)"
    message: "HIGH: Registro de PII sensible en texto plano (CWE-359). Imprimir correos, cédulas o teléfonos en logs viola la Ley 1581 de protección de datos."
    severity: ERROR
    languages:
      - javascript

  - id: express-sqli-custom
    mode: taint
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
      - pattern: req.params
    pattern-sinks:
      - pattern: db.get($QUERY, ...)
      - pattern: db.run($QUERY, ...)
      - pattern: db.all($QUERY, ...)
    message: "CRITICAL: Posible inyección SQL (CWE-89) detectada. Los datos de entrada del usuario llegan a la base de datos sin ser parametrizados."
    severity: ERROR
    languages:
      - javascript

  - id: jwt-decode-without-verify-custom
    patterns:
      - pattern: jwt.decode(...)
      - pattern-not-inside: |
          jwt.verify(...)
          ...
    message: "HIGH: Uso de jwt.decode() sin una verificación previa (CWE-345). Esto permite ataques de alteración de token o alg:none."
    severity: ERROR
    languages:
      - javascript