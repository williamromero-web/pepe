openapi: 3.0.0
info:
  title: FleetSec API
  version: 1.0.0
servers:
  - url: http://localhost:3000
paths:
  /api/login:
    post:
      summary: Endpoint de Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK
          
  /api/proxy:
    get:
      summary: Endpoint Proxy (SSRF)
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          
  /api/users/{id}:
    get:
      summary: Obtener perfil (IDOR / SQLi)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          
  /api/xml-upload:
    post:
      summary: Subir XML (XXE)
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: string
      responses:
        '200':
          description: OK
          
  /api/users/update:
    post:
      summary: Actualizar usuario (Mass Assignment)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: OK

  /api/files:
    get:
      summary: Leer archivos (Path Traversal)
      parameters:
        - name: file
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT